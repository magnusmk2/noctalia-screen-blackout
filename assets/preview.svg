<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Screen Blackout interface illustration</title>
<desc id="desc">A stylized monitor picker with one display blacked out. The actual layout follows the connected monitors.</desc>
<rect width="960" height="540" rx="24" fill="#11131c"/>
<g font-family="sans-serif" fill="#dce1f5">
<text x="64" y="88" font-size="34" font-weight="700">Screen Blackout</text>
<text x="64" y="126" font-size="19" fill="#aab4d3">Choose a display. Keep your setup running.</text>
<rect x="64" y="165" width="832" height="274" rx="18" fill="#1c2030" stroke="#39415c"/>
<text x="90" y="207" font-size="21" font-weight="700">Monitor layout</text>
<rect x="90" y="234" width="140" height="169" rx="10" fill="#282e43" stroke="#64708c"/>
<rect x="244" y="251" width="350" height="135" rx="10" fill="#000" stroke="#8cacf6" stroke-width="3"/>
<rect x="608" y="269" width="255" height="100" rx="10" fill="#282e43" stroke="#64708c"/>
<g text-anchor="middle" font-size="17"><text x="160" y="313">Display 1</text><text x="160" y="341" fill="#aab4d3">Visible</text><text x="419" y="310">Display 2</text><text x="419" y="338" fill="#8cacf6">Blacked out</text><text x="735" y="313">Display 3</text><text x="735" y="341" fill="#aab4d3">Visible</text></g>
<text x="64" y="485" font-size="16" fill="#aab4d3">Noctalia + Hyprland · Interface illustration · Layout adapts to your monitors</text>
</g></svg>
